<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--ink:#15261B;--muted:#6E7B71;--line:#DDE3DC;--bg:#EDF1EB;--card:#FFFFFF;--green:#1F6B43;--route:#E8622A;--routeSoft:#F5C9B4}
  body{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .mark{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(31,107,67,.28)}
  .title{font-weight:800;font-size:29px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;font-stretch:condensed}
  .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
  .prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:14px}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .prog-lbl{text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.09em;color:var(--muted)}
  .prog-num{font-weight:800;font-size:18px;font-stretch:condensed}
  .prog-num b{color:var(--green)}
  .bar{height:8px;border-radius:6px;background:#E4E9E2;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .35s ease}
  .add{display:flex;gap:8px;margin-bottom:11px}
  #inp{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink)}
  #inp::placeholder{color:#A7B0A8}
  #inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,107,67,.13)}
  .btn{border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;padding:0 18px;cursor:pointer;white-space:nowrap;font-stretch:condensed}
  .btn:active{transform:scale(.96)}
  .mic{border:1.5px solid var(--line);background:var(--card);border-radius:12px;width:50px;flex:0 0 auto;cursor:pointer;color:var(--green);display:flex;align-items:center;justify-content:center}
  .mic:active{transform:scale(.95)}
  .mic.rec{background:var(--route);border-color:var(--route);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,98,42,.45)}50%{box-shadow:0 0 0 7px rgba(232,98,42,0)}}
  .seg{display:flex;background:#E2E7E0;border-radius:10px;padding:3px;gap:3px}
  .segb{border:none;background:transparent;border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-stretch:condensed}
  .segb.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .editbar{flex-wrap:wrap;row-gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
  .chip:active{transform:scale(.95);border-color:var(--green);color:var(--green)}
  .tabs{display:flex;background:#E2E7E0;border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
  .tab{flex:1;border:none;background:transparent;border-radius:9px;padding:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:14px;color:var(--muted);font-stretch:condensed}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.07)}
  .sec{margin-bottom:14px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .stop{width:24px;height:24px;border-radius:50%;flex:0 0 auto;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-stretch:condensed}
  .sec-name{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;font-stretch:condensed}
  .sec-count{font-size:13px;color:var(--muted);font-weight:600}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .check{width:23px;height:23px;flex:0 0 auto;border-radius:7px;border:2px solid #C4CCBF;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .check.on{background:var(--green);border-color:var(--green)}
  .name{flex:1;font-size:16px;cursor:pointer;user-select:none}
  .row.done .name{text-decoration:line-through;color:#B2BAB1}
  .resec{border:1px solid var(--line);border-radius:8px;background:#F7F9F6;color:var(--muted);font-size:12px;font-family:inherit;padding:5px 6px;max-width:104px}
  .del{border:none;background:transparent;color:#C4CCBF;cursor:pointer;font-size:22px;line-height:1;padding:2px 6px}
  .del:active{color:var(--route)}
  .empty{text-align:center;padding:46px 20px;color:var(--muted)}
  .empty b{display:block;font-size:20px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 5px;font-stretch:condensed}
  .editbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;background:#F3F8F3;border:1px solid #CFE3D4;border-radius:12px;padding:10px 13px}
  .editbar .t{font-size:13px;color:var(--green);font-weight:700}
  .mapwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}
  .mapwrap svg{width:100%;height:auto;display:block}
  .legend{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
  .leg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
  .leg-dot{width:13px;height:13px;border-radius:50%}
  .erow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .ecolor{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
  .ename{flex:1;font-weight:600;font-size:15px}
  .arrow{border:1px solid var(--line);background:#F7F9F6;border-radius:8px;width:34px;height:34px;font-size:17px;cursor:pointer;color:var(--ink)}
  .arrow:disabled{opacity:.3}
  .arrow:active:not(:disabled){background:#E9F2EA}
  .foot{display:flex;gap:9px;margin-top:8px}
  .fbtn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:11px;padding:11px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;font-stretch:condensed}
  .fbtn:active{transform:scale(.98);border-color:var(--route);color:var(--route)}
  .tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
  @media(max-width:430px){.title{font-size:25px}.resec{max-width:88px}}
</style>

  var OTHER={id:'sonstiges',label:'Sonstiges',color:'#8A8F88'};

  function area(id){ for(var i=0;i<AREAS.length;i++) if(AREAS[i].id===id) return AREAS[i]; return OTHER; }
  var SHOP = AREAS.filter(function(a){return a.shoppable;});

  // Reihenfolge der Schlüsselwort-Prüfung (verhindert Fehlzuordnung wie Reis->Eis)
  var DETECT=['obstgemuese','molkerei','konserven','wurstfleisch','kosmetik','reinigung','tiernahrung','naehrmittel','tiefkuehl','seafood','suesswaren','gewuerze','baecker','brot','getraenke','wein','spirituosen','kaffeetee','confiserie','bio','salate','kaese','feinkost','haushalt','elektro','tabak'];
  function detect(name){
    var n=name.toLowerCase().trim();
    for(var i=0;i<DETECT.length;i++){var a=area(DETECT[i]);for(var j=0;j<a.kw.length;j++) if(n.indexOf(a.kw[j])>-1) return a.id;}
    return OTHER.id;
  }

  // Laufreihenfolge (Eingang unten-links -> unten -> rechts -> oben -> innen -> Kassen)
  var DEFAULT_ORDER=['baecker','brot','confiserie','bio','salate','kaese','molkerei','konserven','reinigung','tiernahrung','getraenke','wurstfleisch','tiefkuehl','gvtk','spirituosen','wein','obstgemuese','seafood','feinkost','haushalt','elektro','naehrmittel','gewuerze','suesswaren','kaffeetee','kosmetik','tabak'];

  var KI='cittilotse.items.v2', KO='cittilotse.order.v2', KM='cittilotse.mode.v2', mem={};
  function load(k){ try{var v=localStorage.getItem(k);return v==null?null:v;}catch(e){return mem[k]||null;} }
  function save(k,v){ try{localStorage.setItem(k,v);}catch(e){mem[k]=v;} }

  var state={
    items:JSON.parse(load(KI)||'[]'),
    order:(function(){var o=JSON.parse(load(KO)||'null');if(!o)return DEFAULT_ORDER.slice();var c=o.filter(function(id){return area(id).shoppable;});DEFAULT_ORDER.forEach(function(id){if(c.indexOf(id)<0)c.push(id);});return c;})(),
    tab:'liste',edit:false,
    routeMode:(load(KM)==='short'?'short':'manual')
  };
  function persist(){ save(KI,JSON.stringify(state.items)); save(KO,JSON.stringify(state.order)); save(KM,state.routeMode); }
  function orderIdx(id){var i=state.order.indexOf(id);return i<0?98:i;}
  function find(id){for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i];return null;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var App={
    add:function(name){name=(name||'').trim();if(!name)return;state.items.push({id:Date.now()+'_'+Math.round(Math.random()*1e5),name:name,sectionId:detect(name),done:false});persist();render();},
    toggle:function(id){var it=find(id);if(it){it.done=!it.done;persist();render();}},
    remove:function(id){state.items=state.items.filter(function(x){return x.id!==id;});persist();render();},
    resec:function(id,sid){var it=find(id);if(it){it.sectionId=sid;persist();render();}},
    clearDone:function(){state.items=state.items.filter(function(x){return !x.done;});persist();render();},
    clearAll:function(){if(confirm('Ganze Liste löschen?')){state.items=[];persist();render();}},
    setTab:function(t){state.tab=t;render();},
    toggleEdit:function(){state.edit=!state.edit;render();},
    setMode:function(m){state.routeMode=m;state.edit=false;persist();render();},
    move:function(id,dir){var i=state.order.indexOf(id),j=i+dir;if(i<0||j<0||j>=state.order.length)return;var t=state.order[i];state.order[i]=state.order[j];state.order[j]=t;persist();render();},
    resetOrder:function(){if(confirm('Reihenfolge auf Standard zurücksetzen?')){state.order=DEFAULT_ORDER.slice();persist();render();}}
  };
  window.App=App;

  function hasItems(id){return state.items.some(function(it){return it.sectionId===id;});}
  function ctr(id){var a=area(id);return [a.x+a.w/2,a.y+a.h/2];}
  function dpt(p,q){var dx=p[0]-q[0],dy=p[1]-q[1];return Math.sqrt(dx*dx+dy*dy);}

  // ---- Gang-Netz: Rundweg + Quergänge, damit Wege den Gängen folgen ----
  var JUNC={TL:[365,105],TR:[925,105],BR:[925,490],BL:[365,490],ML:[365,335],MR:[925,335],K:[200,430],E:[200,545]};
  var SEGS=[['TL','TR'],['TR','MR'],['MR','BR'],['BR','BL'],['BL','ML'],['ML','TL'],['ML','MR'],['BL','E'],['E','K'],['K','ML']];
  var NODES=[],ADJ=[];
  (function(){
    var idx={};
    function node(x,y){var k=Math.round(x)+','+Math.round(y);if(idx[k]==null){idx[k]=NODES.length;NODES.push([x,y]);ADJ.push([]);}return idx[k];}
    function edge(a,b){if(a===b)return;var w=dpt(NODES[a],NODES[b]);ADJ[a].push([b,w]);ADJ[b].push([a,w]);}
    SEGS.forEach(function(s){var A=JUNC[s[0]],B=JUNC[s[1]],L=dpt(A,B),n=Math.max(1,Math.round(L/70)),prev=node(A[0],A[1]);
      for(var i=1;i<=n;i++){var t=i/n,cur=node(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t);edge(prev,cur);prev=cur;}});
  })();
  function nearestNode(p){var bi=0,bd=Infinity;for(var i=0;i<NODES.length;i++){var d=dpt(p,NODES[i]);if(d<bd){bd=d;bi=i;}}return bi;}
  var _dc={};
  function dijkstra(src){
    if(_dc[src])return _dc[src];
    var n=NODES.length,dist=[],prev=[],vis=[];
    for(var i=0;i<n;i++){dist[i]=Infinity;prev[i]=-1;vis[i]=false;}
    dist[src]=0;
    for(var c=0;c<n;c++){var u=-1,ud=Infinity;for(var i=0;i<n;i++)if(!vis[i]&&dist[i]<ud){ud=dist[i];u=i;}if(u<0)break;vis[u]=true;
      for(var e=0;e<ADJ[u].length;e++){var v=ADJ[u][e][0],w=ADJ[u][e][1];if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}}
    return _dc[src]={dist:dist,prev:prev};
  }
  function access(id){return nearestNode(ctr(id));}
  function nodePath(a,b){var pr=dijkstra(a).prev,path=[],u=b;if(a===b)return [NODES[a].slice()];while(u!==-1){path.unshift(NODES[u].slice());if(u===a)break;u=pr[u];}return path;}
  function pathDist(a,b){var na=access(a),nb=access(b);return dpt(ctr(a),NODES[na])+dijkstra(na).dist[nb]+dpt(NODES[nb],ctr(b));}
  // Kürzeste Route entlang der Gänge: Nearest-Neighbor ab Eingang + 2-opt, Ende an Kassen
  function computeShort(ids){
    if(ids.length<=1)return ids.slice();
    var rem=ids.slice(),route=[],cur='eingang';
    while(rem.length){var bi=0,bd=Infinity;for(var i=0;i<rem.length;i++){var d=pathDist(cur,rem[i]);if(d<bd){bd=d;bi=i;}}route.push(rem[bi]);cur=rem[bi];rem.splice(bi,1);}
    function cost(r){var c=pathDist('eingang',r[0]);for(var i=0;i<r.length-1;i++)c+=pathDist(r[i],r[i+1]);return c+pathDist(r[r.length-1],'kassen');}
    var best=route,bestC=cost(route),improved=true,guard=0;
    while(improved&&guard++<60){improved=false;
      for(var i=0;i<best.length-1;i++)for(var j=i+1;j<best.length;j++){
        var nr=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1)),c=cost(nr);
        if(c<bestC-0.01){best=nr;bestC=c;improved=true;}
      }
    }
    return best;
  }
  function walkOrder(){
    var active=state.order.filter(hasItems);
    SHOP.forEach(function(s){if(hasItems(s.id)&&active.indexOf(s.id)<0)active.push(s.id);});
    return state.routeMode==='short'?computeShort(active):active;
  }
  function groups(){
    var seq=walkOrder(),m={};state.items.forEach(function(it){(m[it.sectionId]=m[it.sectionId]||[]).push(it);});
    return Object.keys(m).map(function(sid){return {a:area(sid),items:m[sid]};}).sort(function(x,y){
      var ix=seq.indexOf(x.a.id),iy=seq.indexOf(y.a.id);if(ix<0)ix=999;if(iy<0)iy=999;return ix-iy;
    });
  }

  function render(){
    var total=state.items.length, done=state.items.filter(function(i){return i.done;}).length, pct=total?Math.round(done/total*100):0;
    var chips=document.getElementById('chips');
    if(!chips.dataset.built){chips.innerHTML=['Milch','Brot','Eier','Butter','Äpfel','Hackfleisch','Nudeln','Reis','Kaffee','Wasser','Klopapier','Müsli','Spülmittel','Joghurt','Käse','Bananen'].map(function(s){return '<button class="chip">'+esc(s)+'</button>';}).join('');chips.dataset.built='1';}
    document.getElementById('prog').innerHTML=total?('<div class="prog"><div class="prog-top"><span class="prog-lbl">Eingesammelt</span><span class="prog-num"><b>'+done+'</b> / '+total+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'):'';
    document.getElementById('tabs').style.display=total?'flex':'none';
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.dataset.tab===state.tab);});
    var view=document.getElementById('view'),foot=document.getElementById('foot'),hint=document.getElementById('hint');
    if(total===0){
      view.innerHTML='<div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" style="opacity:.35"><path d="M4 19 L9 6 L13 15 L16 9 L20 19" stroke="#15261B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Liste ist leer</b>Tipp Artikel ein oder nutz die Vorschläge oben &ndash; der Lotse sortiert alles nach deinem Citti-Lageplan.</div>';
      foot.innerHTML='';hint.innerHTML='Tipp: Über das Browser-Menü &bdquo;Zum Home-Bildschirm&ldquo; landet der Lotse als App-Icon auf deinem Handy.';return;
    }
    view.innerHTML = state.tab==='liste'?renderList():renderMap();
    foot.innerHTML='<div class="foot">'+(done>0?'<button class="fbtn" onclick="App.clearDone()">Erledigte entfernen</button>':'')+'<button class="fbtn" onclick="App.clearAll()">Alles löschen</button></div>';
    hint.innerHTML = state.tab==='karte' && !state.edit ? 'Stimmt etwas nicht mit dem echten Markt? Über &bdquo;Anpassen&ldquo; schiebst du die Bereiche zurecht.' : '';
  }

  function renderList(){
    var gs=groups(),html='',n=0;
    gs.forEach(function(g){
      var other=g.a.id===OTHER.id; if(!other)n++;
      var open=g.items.filter(function(i){return !i.done;}).length;
      html+='<section class="sec"><div class="sec-head"><span class="stop" style="background:'+(g.a.color||'#8A8F88')+'">'+(other?'&bull;':n)+'</span><span class="sec-name">'+esc(g.a.label)+'</span><span class="sec-count">'+open+'/'+g.items.length+'</span></div><div class="box">';
      g.items.forEach(function(it){
        var opts=SHOP.concat([OTHER]).map(function(s){return '<option value="'+s.id+'"'+(s.id===it.sectionId?' selected':'')+'>'+esc(s.label)+'</option>';}).join('');
        html+='<div class="row'+(it.done?' done':'')+'"><button class="check'+(it.done?' on':'')+'" onclick="App.toggle(\''+it.id+'\')">'+(it.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+'</button><span class="name" onclick="App.toggle(\''+it.id+'\')">'+esc(it.name)+'</span><select class="resec" onchange="App.resec(\''+it.id+'\',this.value)">'+opts+'</select><button class="del" onclick="App.remove(\''+it.id+'\')">&times;</button></div>';
      });
      html+='</div></section>';
    });
    return html;
  }

  function labelLines(a,maxChars){
    var raw=a.label.replace(/&/g,'& ').replace(/-/g,'- ').split(/\s+/),words=[];
    for(var r=0;r<raw.length;r++){var w=raw[r];if(!w)continue;while(w.length>maxChars){words.push(w.slice(0,maxChars-1)+'-');w=w.slice(maxChars-1);}words.push(w);}
    var lines=[],cur='';
    for(var i=0;i<words.length;i++){var w=words[i];if((cur+' '+w).trim().length>maxChars && cur){lines.push(cur.trim());cur=w;}else cur=(cur+' '+w).trim();}
    if(cur)lines.push(cur.trim());
    return lines.slice(0,3);
  }
  function cell(a,num){
    var cxv=a.x+a.w/2, cyv=a.y+a.h/2, fill,stroke,txt,fop=1,sop=1;
    if(a.kind==='entry'){fill='#1F6B43';stroke='#1F6B43';txt='#fff';}
    else if(a.kind==='kasse'){fill='#15261B';stroke='#15261B';txt='#fff';}
    else if(a.kind==='lm'){fill='#D6DDD4';stroke='#C4CCBF';txt='#5A6760';}
    else if(a.kind==='nf'){fill='#E7EBE5';stroke='#DBE1D8';txt='#9AA39A';}
    else if(num){fill=a.color;stroke=a.color;txt='#fff';}
    else {fill=a.color;stroke=a.color;txt='#33403A';fop=0.16;sop=0.55;}
    var s='<g><rect x="'+a.x+'" y="'+a.y+'" width="'+a.w+'" height="'+a.h+'" rx="7" fill="'+fill+'" fill-opacity="'+fop+'" stroke="'+stroke+'" stroke-opacity="'+sop+'" stroke-width="1.5"/>';
    var rotate=a.w<70 && a.h>a.w*1.5;
    if(rotate){
      var rl=a.label, rfs=Math.max(8,Math.min(12,Math.floor(2*(a.h-8)/Math.max(1,rl.length))));
      s+='<text x="'+cxv+'" y="'+cyv+'" transform="rotate(-90 '+cxv+' '+cyv+')" text-anchor="middle" font-size="'+rfs+'" font-weight="700" fill="'+txt+'" style="font-stretch:condensed">'+esc(rl)+'</text>';
    } else {
      var lines = a.h<34 ? [a.label] : labelLines(a,Math.max(5,Math.floor(a.w/6.0)));
      var longest=0; for(var li=0;li<lines.length;li++) if(lines[li].length>longest) longest=lines[li].length;
      var fs=Math.min(13, Math.floor(2*(a.w-6)/Math.max(1,longest)), Math.floor((a.h-4)/(lines.length*1.15))); if(fs<8)fs=8;
      var y0=cyv-((lines.length-1)*fs*0.58);
      for(var i=0;i<lines.length;i++) s+='<text x="'+cxv+'" y="'+(y0+i*fs*1.15+fs*0.34)+'" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="'+txt+'" style="font-stretch:condensed">'+esc(lines[i])+'</text>';
    }
    if(num){s+='<circle cx="'+(a.x+a.w-12)+'" cy="'+(a.y+12)+'" r="11" fill="#15261B" stroke="#fff" stroke-width="2"/><text x="'+(a.x+a.w-12)+'" y="'+(a.y+16.5)+'" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" style="font-stretch:condensed">'+num+'</text>';}
    return s+'</g>';
  }

  function renderMap(){
    if(state.edit) return renderEditor();
    var seq=walkOrder(), numOf={}; seq.forEach(function(id,i){numOf[id]=i+1;});
    var svg='<svg viewBox="0 0 1000 640" role="img" aria-label="Citti Lageplan">';
    svg+='<rect x="108" y="14" width="892" height="612" rx="20" fill="#F6F8F4" stroke="#E1E7DF" stroke-width="2"/>';
    // Rundweg (Hauptlaufweg) als gestrichelte Schleife
    svg+='<path d="M365 105 H925 V490 H365 Z M365 335 H925" fill="none" stroke="#C9D3CB" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/>';
    // Route entlang der Gänge: Eingang -> Stationen -> Kassen
    var seqFull=['eingang'].concat(seq).concat(['kassen']),rpts=[];
    function pushPt(p){var n=rpts.length;if(n===0||Math.abs(rpts[n-1][0]-p[0])>0.5||Math.abs(rpts[n-1][1]-p[1])>0.5)rpts.push([Math.round(p[0]),Math.round(p[1])]);}
    pushPt(ctr(seqFull[0]));
    for(var i=0;i<seqFull.length-1;i++){
      var na=access(seqFull[i]),nb=access(seqFull[i+1]);
      pushPt(NODES[na]); var np=nodePath(na,nb); for(var k=0;k<np.length;k++) pushPt(np[k]); pushPt(ctr(seqFull[i+1]));
    }
    var dpath=rpts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1];}).join(' ');
    svg+='<path d="'+dpath+'" fill="none" stroke="#F5C9B4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>';
    svg+='<path d="'+dpath+'" fill="none" stroke="#E8622A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 10"/>';
    // Bereiche
    for(var i=0;i<AREAS.length;i++){var a=AREAS[i];svg+=cell(a, a.shoppable?numOf[a.id]:0);}
    // Eingangs-Markierung
    svg+='<text x="146" y="556" font-size="11" font-weight="800" fill="#1F6B43" style="font-stretch:condensed">START</text>';
    svg+='</svg>';
    var others=state.items.filter(function(it){return it.sectionId===OTHER.id;});
    var legend='<div class="legend"><span class="leg"><span style="width:18px;height:3px;border-radius:2px;background:#E8622A;display:inline-block"></span>deine Route</span><span class="leg"><span class="leg-dot" style="background:#1F6B43"></span>Eingang</span><span class="leg"><span class="leg-dot" style="background:#15261B"></span>Kassen</span></div>';
    var manual=state.routeMode!=='short';
    var head='<div class="editbar"><div class="seg"><button class="segb'+(manual?' on':'')+'" onclick="App.setMode(\'manual\')">Meine Reihenfolge</button><button class="segb'+(!manual?' on':'')+'" onclick="App.setMode(\'short\')">Kürzester Weg</button></div>'+(manual?'<button class="fbtn" style="flex:0 0 auto;padding:8px 12px" onclick="App.toggleEdit()">Anpassen</button>':'')+'</div>';
    var note = others.length?'<div class="tiny" style="margin-top:8px">&bdquo;Sonstiges&ldquo; ('+others.length+') ist keinem Bereich zugeordnet &ndash; siehe Liste.</div>':'';
    return head+'<div class="mapwrap">'+svg+legend+'</div>'+note;
  }

  function renderEditor(){
    var html='<div class="editbar"><span class="t">Reihenfolge im Markt festlegen</span><button class="fbtn" style="flex:0 0 auto;padding:8px 14px;border-color:var(--green);color:var(--green)" onclick="App.toggleEdit()">Fertig</button></div>';
    state.order.forEach(function(id,i){var a=area(id);
      html+='<div class="erow"><span class="ecolor" style="background:'+(a.color||'#8A8F88')+'"></span><span class="ename">'+esc(a.label)+'</span><button class="arrow" onclick="App.move(\''+id+'\',-1)" '+(i===0?'disabled':'')+'>&#9650;</button><button class="arrow" onclick="App.move(\''+id+'\',1)" '+(i===state.order.length-1?'disabled':'')+'>&#9660;</button></div>';
    });
    return html+'<button class="fbtn" style="width:100%;margin-top:6px" onclick="App.resetOrder()">Auf Standard zurücksetzen</button>';
  }

  var inp=document.getElementById('inp');
  document.getElementById('addBtn').onclick=function(){App.add(inp.value);inp.value='';inp.focus();};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){App.add(inp.value);inp.value='';}});
  document.getElementById('chips').addEventListener('click',function(e){if(e.target.classList.contains('chip'))App.add(e.target.textContent);});
  document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b){state.edit=false;App.setTab(b.dataset.tab);}});

  // Spracheingabe (Web Speech API) -- diktiere z. B. "Milch, Brot und Eier"
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, micBtn=document.getElementById('micBtn'), rec=null, recActive=false;
  if(SR){
    micBtn.style.display='flex';
    micBtn.onclick=function(){
      if(recActive){ try{rec.stop();}catch(e){} return; }
      rec=new SR(); rec.lang='de-DE'; rec.interimResults=false; rec.maxAlternatives=1;
      rec.onstart=function(){recActive=true;micBtn.classList.add('rec');inp.placeholder='Sprich jetzt \u2026';};
      rec.onerror=function(e){ if(e.error==='not-allowed'||e.error==='service-not-allowed') alert('Mikrofon-Zugriff nicht erlaubt. In den iPad-Einstellungen bei Safari das Mikrofon freigeben.'); };
      rec.onend=function(){recActive=false;micBtn.classList.remove('rec');inp.placeholder='Was brauchst du? z. B. Milch';};
      rec.onresult=function(e){
        var txt=''; for(var i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
        txt.split(/,|;|\bund\b/i).forEach(function(p){ p=p.replace(/[.!?]+$/,'').trim(); if(p) App.add(p.charAt(0).toUpperCase()+p.slice(1)); });
      };
      try{rec.start();}catch(e){}
    };
  } else {
    micBtn.style.display='flex';
    micBtn.onclick=function(){ inp.focus(); alert('Live-Diktat direkt in die App braucht eine sichere https-Adresse und Internet. Alternativ: Tippe ins Eingabefeld und nutze das Mikrofon-Symbol der iPad-Tastatur, um Artikel zu diktieren.'); };
  }

  render();
})();
</script>
</body>
</html>
